name: Deploy browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PixelFX and build browser adapter
        run: npm install --no-audit --no-fund && npm run build
      - name: Check JavaScript syntax
        run: node --check game.js && node --check tests/smoke.cjs && node --check tests/progression.cjs && node --check tests/simulation.cjs && node --check src/rules/enhancement.cjs && node --check tests/enhancement.cjs && node --check src/rules/save-v3.cjs && node --check tests/save-v3.cjs && node --check tests/browser-v3.cjs && node --check tests/enhancement-integration.cjs
      - name: Run game smoke test
        run: node tests/smoke.cjs && node tests/progression.cjs && node tests/simulation.cjs && node tests/enhancement.cjs && node tests/save-v3.cjs && node tests/browser-v3.cjs && node tests/enhancement-integration.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
