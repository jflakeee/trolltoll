<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101d20">
<title>Troll Toll — Idle RPG Web</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101d20;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#help{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:min(340px,calc(100vw - 24px));background:#102521df;border:1px solid #7da58b77;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;pointer-events:none}
#help strong{display:block;font-size:13px;color:#d8f7db}
#help .desktop{display:inline}
#help .mobile{display:none}
@media(pointer:coarse){#help .desktop{display:none}#help .mobile{display:inline}}
#help[hidden]{display:none}
#toggleHelp{position:fixed;right:12px;top:12px;z-index:2;background:#102521dd;border:1px solid #8aa996;border-radius:10px;color:#fff;padding:8px 12px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game" aria-label="Troll Toll 게임 화면"></canvas>
<button id="toggleHelp" type="button" aria-controls="help" aria-expanded="true">도움말 숨기기</button>
<div id="help" role="note"><strong>Troll Toll — 자동 성장 RPG</strong><span class="desktop">WASD 또는 방향키로 이동하세요.</span><span class="mobile">화면을 터치한 뒤 드래그하여 이동하세요.</span><div>가까운 몬스터를 자동 공격합니다. 처치하면 능력치가 영구 증가하고 진행 상황은 이 브라우저에 저장됩니다.</div></div>
<script src="game.js"></script>
<script>
const toggle=document.getElementById('toggleHelp'),help=document.getElementById('help');
toggle.addEventListener('click',()=>{help.hidden=!help.hidden;toggle.textContent=help.hidden?'도움말 보기':'도움말 숨기기';toggle.setAttribute('aria-expanded',String(!help.hidden))});
</script>
</body>
</html>
