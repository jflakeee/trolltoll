name: Validate pull request
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/enhancement-engine-v3-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and bundle PixelFX
        run: npm install --no-audit --no-fund && npm run build
      - name: Validate all JavaScript syntax
        run: |
          node --check game.js
          find src tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Run regression suite
        run: npm test
