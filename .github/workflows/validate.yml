name: Validate pull request
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/enhancement-engine-v3-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check game.js
          node --check src/rules/enhancement.cjs
          node --check src/rules/save-v3.cjs
      - name: Run regression suite
        run: npm test
