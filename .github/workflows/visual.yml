name: Mobile visual verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and bundle PixelFX
        run: npm install --no-audit --no-fund && npm run build
      - name: Install browser test dependencies
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Capture and verify mobile game
        run: node tests/visual.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trolltoll-mobile-visual
          path: visual-results/*.png
          if-no-files-found: ignore
