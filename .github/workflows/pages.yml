name: Deploy browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PixelFX and build browser adapter
        run: npm install --no-audit --no-fund && npm run build
      - name: Check JavaScript syntax
        run: node --check game.js && node --check tests/smoke.cjs && node --check tests/progression.cjs && node --check tests/simulation.cjs && node --check src/rules/enhancement.cjs && node --check tests/enhancement.cjs && node --check src/rules/save-v3.cjs && node --check tests/save-v3.cjs && node --check tests/browser-v3.cjs && node --check tests/enhancement-integration.cjs && node --check tests/enhancement-gameplay.cjs && node --check tests/enhancement-mobile.cjs && node --check tests/studio-config.cjs
      - name: Run game smoke test
        run: node tests/smoke.cjs && node tests/progression.cjs && node tests/simulation.cjs && node tests/enhancement.cjs && node tests/save-v3.cjs && node tests/browser-v3.cjs && node tests/enhancement-integration.cjs && node tests/enhancement-gameplay.cjs && node tests/enhancement-mobile.cjs && node tests/studio-config.cjs
      - name: Prepare minimal public game artifact
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          cp index.html game.js site/
          cp vendor/pixelfx.js site/vendor/
          test -s site/index.html
          test -s site/game.js
          test -s site/vendor/pixelfx.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed game script
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 "https://jflakeee.github.io/trolltoll/game.js?sha=${GITHUB_SHA}" -o /tmp/trolltoll-deployed.js && grep -q 'function attemptEnhancement()' /tmp/trolltoll-deployed.js; then
              echo "Published game.js contains the enhancement gameplay."
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (attempt ${attempt}/6)"
            sleep 10
          done
          echo "::error::Published game.js does not contain the expected enhancement gameplay."
          exit 1

