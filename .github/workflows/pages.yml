name: Deploy browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PixelFX and build browser adapter
        run: npm install --no-audit --no-fund && npm run build
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check game.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
      - name: Run full regression suite (including Game Studios integration)
        run: npm test
      - name: Prepare minimal public game artifact
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          cp index.html game.js site/
          cp vendor/pixelfx.js site/vendor/
          test -s site/index.html
          test -s site/game.js
          test -s site/vendor/pixelfx.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed game script
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 "https://jflakeee.github.io/trolltoll/game.js?sha=${GITHUB_SHA}" -o /tmp/trolltoll-deployed.js && curl --fail --silent --show-error --location --max-time 15 "https://jflakeee.github.io/trolltoll/index.html?sha=${GITHUB_SHA}" -o /tmp/trolltoll-deployed.html && curl --fail --silent --show-error --location --max-time 15 "https://jflakeee.github.io/trolltoll/vendor/pixelfx.js?sha=${GITHUB_SHA}" -o /tmp/trolltoll-deployed-pixelfx.js && cmp -s site/game.js /tmp/trolltoll-deployed.js && cmp -s site/index.html /tmp/trolltoll-deployed.html && cmp -s site/vendor/pixelfx.js /tmp/trolltoll-deployed-pixelfx.js; then
              echo "Published HTML, game script and PixelFX bundle match the committed build artifacts."
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (attempt ${attempt}/6)"
            sleep 10
          done
          echo "::error::Published HTML, game script or PixelFX bundle differs from the committed build artifacts."
          exit 1

